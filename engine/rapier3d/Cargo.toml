[package]
name    = "rapier3d"
version = "0.32.0"
edition = "2024"
license = "Apache-2.0"
# koper fork — stripped for MC Panama FFI
# src: github.com/dimforge/rapier (Apache-2.0)

[lib]
name = "rapier3d"
path = "src/lib.rs"
required-features = ["dim3", "f32"]

[lints.clippy]
needless_lifetimes = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("dim2", "f64", "std"))'] }

[features]
default  = ["dim3", "f32", "std"]
dim3     = []
f32      = []
std      = [
    "parry3d/std", "nalgebra/std", "simba/std",
    "num-traits/std", "approx/std", "thiserror/std", "wide/std",
]
parallel     = ["dep:rayon", "std"]
simd-stable  = ["parry3d/simd-stable", "simba/wide", "simd-is-enabled"]
simd-nightly = ["parry3d/simd-nightly", "simba/portable_simd", "simd-is-enabled"]
simd-is-enabled = []
# stripped — kept as empty stubs so downstream code using these feature flags doesn't break
serde-serialize                        = []
enhanced-determinism                   = []
debug-render                           = []
profiler                               = []
debug-disable-legitimate-fe-exceptions = []
dev-remove-slow-accessors              = []

[dependencies]
nalgebra          = { version = "0.34",   default-features = false, features = ["macros", "alloc"] }
glamx             = { version = "0.1",    default-features = false, features = ["nalgebra"] }
parry3d           = { version = "0.26.0", default-features = false, features = ["required-features", "alloc"] }
simba             = { version = "0.9.1",  default-features = false }
num-traits        = { version = "0.2",    default-features = false }
approx            = { version = "0.5",    default-features = false }
bitflags          = "2"
log               = "0.4"
thiserror         = { version = "2",      default-features = false }
profiling         = "1.0"
static_assertions = "1"
wide              = { version = "0.7.1",  default-features = false }
rayon             = { version = "1",      optional = true }
